name: tom_kpasslib
description: >-
  Read, modify and write KeePass v2 databases (KDBX 3 and 4) in Dart, on the
  VM and on the web. The Tom Framework's fork of kpasslib (MIT).
version: 1.1.2+tom.2
repository: https://github.com/al-the-bear/tom_kpasslib
issue_tracker: https://github.com/al-the-bear/tom_kpasslib/issues

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  archive: ^4.0.1
  collection: ^1.18.0
  convert: ^3.1.1
  crypto: ^3.0.6
  ffi: ^2.1.3
  # Argon2 on the web: kpasslib's own Argon2 and Blake2b need 64-bit integers,
  # which dart2js does not have. On the VM the pure-Dart implementation stays.
  pointycastle: '>=3.7.0 <5.0.0'
  # 7.x as well: pdf 3.13 needs xml ^7.0.1.
  xml: '>=6.2.2 <8.0.0'

dev_dependencies:
  lints: ^5.0.0
  stream_channel: ^2.1.0
  test: ^1.25.12
